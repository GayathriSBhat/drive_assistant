[project]
name = "kendrive"
version = "0.1.0"
description = "Driving Tracker voice co-pilot: LiveKit + Gemini Live + Google Maps + ddgs"
authors = [
    { name = "Gayathri-office", email = "gayathri.bhat@kenpath.io" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "livekit-agents[google]>=1.8.3",
    "livekit-api>=1.2.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
